name: Azure ML CICD

on:
  push:
    branches:
      - main

jobs:
  deploy-dev:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Azure ML CLI
        run: pip install azure-ai-ml

      - name: Deploy to Azure ML (dev)
        run: |
          az ml job create --file dev/pipeline.yml \
            --resource-group ${{ secrets.AZURE_RESOURCE_GROUP }} \
            --workspace-name ${{ secrets.AZURE_ML_WORKSPACE }}

  deploy-test:
    needs: deploy-dev
    environment: test
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to Azure ML (test)
        run: az ml job create --file test/pipeline.yml ...

  deploy-prod:
    needs: deploy-test
    environment: prod
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to Azure ML (prod)
        run: az ml job create --file prod/pipeline.yml ...

