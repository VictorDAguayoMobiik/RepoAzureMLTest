name: cli-jobs-pipelines-nyc-taxi-pipeline
on:
  workflow_dispatch:
  schedule:
    - cron: "0 0/4 * * *"
  pull_request:
    branches:
      - main
    paths:
      - nyc-taxi/**
      - .github/workflows/cli-jobs-pipelines-nyc-taxi-pipeline.yml
      - run-pipeline-jobs.sh
      - setup.sh
permissions:
  id-token: write
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    environment: nycTest
    steps:
    - name: check out repo
      uses: actions/checkout@v4
    - name: azure login
      uses: azure/login@v2
      with:
          creds: ${{secrets.AZURE_CREDENTIALS}}
    - name: Verify Login
      run: az account show
    - name: setup
      run: bash setup.sh
      continue-on-error: true
    - name: run job
      run: bash -x ../run-job.sh pipeline.yml
      working-directory: nyc-taxi
